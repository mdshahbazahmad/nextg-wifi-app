<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Next G WiFi - Self Care</title>
    <style>
        body { background-color: #0F172A; color: white; font-family: Arial, sans-serif; margin: 0; padding: 16px; }
        .header { background-color: #F58220; padding: 15px; border-radius: 8px; text-align: center; font-size: 22px; font-weight: bold; }
        .card { background-color: #1E293B; padding: 16px; border-radius: 10px; margin-top: 15px; border: 1px solid #334155; }
        .btn { background-color: #F58220; color: white; border: none; padding: 12px; width: 100%; border-radius: 6px; font-size: 16px; margin-top: 10px; cursor: pointer; }
        .complaint-btn { background-color: #334155; color: white; border: 1px solid #F58220; padding: 12px; width: 100%; border-radius: 6px; margin-top: 8px; text-align: left; cursor: pointer; }
    </style>
</head>
<body>
    <div class="header">Next G WiFi</div>
    <div class="card">
        <h3>📶 आपका एक्टिव प्लान</h3>
        <p><strong>Speed:</strong> 100 Mbps Unlimited Fiber</p>
        <p><strong>Validity:</strong> 28 दिन बचे हैं</p>
        <button class="btn">💳 ऑनलाइन रिचार्ज करें (UPI)</button>
    </div>
    <div class="card">
        <h3>🚨 त्वरित शिकायत (One-Tap Complaint)</h3>
        <button class="complaint-btn">🔴 राउटर पर रेड लाइट आ रही है</button>
        <button class="complaint-btn">✂️ वाई-फाई केबल/तार कट गई है</button>
        <button class="complaint-btn">🔌 राउटर ऑन नहीं हो रहा है</button>
        <button class="complaint-btn">🚀 इंटरनेट स्लो चल रहा है</button>
    </div>
</body>
</html>
