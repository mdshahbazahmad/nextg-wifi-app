<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Next G Wi-Fi - Eagle Network Sbz</title>

    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#F58220">

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('./pwabuilder-sw.js', { scope: './' })
            .then(function(reg) { console.log('Service Worker Registered!', reg.scope); })
            .catch(function(err) { console.log('SW Registration Failed:', err); });
        });
      }
    </script>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />

    <!-- Firebase SDK (Compat Version) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background-color: #0F172A; color: white; margin: 0; padding: 0; min-height: 100vh; overflow-x: hidden; }

        #splash-screen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(135deg, #0B1120 0%, #1E293B 100%);
            display: flex; flex-direction: column; justify-content: space-between; align-items: center;
            z-index: 99999; text-align: center; padding: 30px 20px; overflow: hidden;
        }

        .splash-main-content {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            margin-top: auto; margin-bottom: auto; z-index: 2; width: 100%; max-width: 450px;
        }
        
        .eagle-loader {
            width: 110px; height: 110px; border-radius: 50%;
            border: 4px solid #F58220; object-fit: cover; background-color: white;
            box-shadow: 0 0 35px rgba(245, 130, 32, 0.8);
        }

        .splash-title { color: #F58220; margin: 15px 0 5px 0; font-size: 32px; font-weight: 900; }
        .brand-footer { color: #94A3B8; font-size: 13px; font-weight: 600; padding-bottom: 10px; }
        .brand-footer strong { color: #F58220; }

        .app-container { padding: 12px; padding-bottom: 30px; max-width: 500px; margin: 0 auto; }

        .top-bar-new {
            display: flex; justify-content: space-between; align-items: center;
            background-color: #1E293B; padding: 10px 14px; border-radius: 12px;
            border: 1px solid #334155; position: relative; min-height: 60px;
        }
        .header-logo-container { display: flex; align-items: center; gap: 8px; }
        .app-brand-logo { width: 32px; height: 32px; border-radius: 50%; border: 1.5px solid #F58220; object-fit: cover; background: white; }
        .app-brand-title { font-weight: 900; font-size: 15px; color: #F58220; text-transform: uppercase; }

        .card { background-color: #1E293B; padding: 20px; border-radius: 14px; margin-top: 15px; border: 1px solid #334155; }
        .btn-primary { background-color: #F58220; color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; }

        .input-group { position: relative; width: 100%; margin-top: 10px; }
        .input-box { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0F172A; color: white; font-size: 14px; }

        .auth-tab-container { display: flex; border-bottom: 2px solid #334155; margin-bottom: 15px; }
        .auth-tab { flex: 1; text-align: center; padding: 10px; font-weight: bold; cursor: pointer; color: #94A3B8; }
        .auth-tab.active { color: #F58220; border-bottom: 2px solid #F58220; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.88); z-index: 10000; justify-content: center; align-items: center; padding: 16px; }
        .modal-content { background: #1E293B; width: 100%; max-width: 420px; border-radius: 14px; padding: 20px; border: 1px solid #334155; position: relative; }

        #login-page { display: block; }
        #dashboard-page { display: none; }
    </style>
</head>
<body>

    <!-- Splash Screen -->
    <div id="splash-screen">
        <div class="splash-main-content">
            <img src="https://i.postimg.cc/wxhBT76M/Next-Wi-Fi-Icon-512x512.png" class="eagle-loader" alt="Logo">
            <h1 class="splash-title">Next G Wi-Fi</h1>
        </div>
        <div class="brand-footer">Powered by <strong>Eagle Network Sbz</strong></div>
    </div>

    <!-- Main Container -->
    <div class="app-container">

        <div class="top-bar-new" id="top-bar" style="display:none;">
            <div class="header-logo-container">
                <img src="https://i.postimg.cc/wxhBT76M/Next-Wi-Fi-Icon-512x512.png" class="app-brand-logo" alt="Logo">
                <span class="app-brand-title">Next G Wi-Fi</span>
            </div>
            <div id="header-user-name" style="font-weight:bold; color:#F58220;"></div>
        </div>

        <!-- LOGIN PAGE -->
        <div id="login-page">
            <div class="card" style="text-align: center;">
                <h2 style="color:#F58220;">Welcome to Next G Wi-Fi</h2>
                <div class="auth-tab-container">
                    <div class="auth-tab active" id="tab-login" onclick="switchAuthTab('login')">Sign In</div>
                    <div class="auth-tab" id="tab-signup" onclick="switchAuthTab('signup')">Register</div>
                </div>

                <div id="form-login-box">
                    <div class="input-group">
                        <input type="text" id="login-id" class="input-box" placeholder="Email or Mobile">
                    </div>
                    <div class="input-group">
                        <input type="password" id="login-password" class="input-box" placeholder="Password">
                    </div>
                    <button class="btn-primary" style="margin-top:15px;" onclick="handleLogin()">🚀 Sign In</button>
                </div>
            </div>
        </div>

        <!-- DASHBOARD PAGE -->
        <div id="dashboard-page">
            <div class="card" style="border-left: 4px solid #10B981;">
                <h3 style="color:#38BDF8; margin:0;">Active Plan</h3>
                <p>Status: <strong style="color:#10B981;">Connected</strong></p>
            </div>
        </div>

    </div>

    <!-- THANK YOU MODAL -->
    <div id="thank-you-modal" class="modal">
        <div class="modal-content" style="text-align: center;">
            <h2 style="color: #10B981;">LOGIN SUCCESSFUL!</h2>
            <button class="btn-primary" onclick="proceedToDashboard()">🚀 Continue to Dashboard</button>
        </div>
    </div>

    <script>
        var isLoggedIn = false;

        const firebaseConfig = {
            apiKey: "AIzaSyCVsmFa6Xr-_EfUqh_ZS6tmzBwcdMZq0JA",
            authDomain: "universal-portal-dashboard.firebaseapp.com",
            databaseURL: "https://universal-portal-dashboard-default-rtdb.firebaseio.com",
            projectId: "universal-portal-dashboard",
            storageBucket: "universal-portal-dashboard.firebasestorage.app",
            messagingSenderId: "403036962443",
            appId: "1:403036962443:web:52b233377303ecb1c3de8e"
        };
        firebase.initializeApp(firebaseConfig);

        window.onload = function() {
            setTimeout(() => {
                document.getElementById("splash-screen").style.display = "none";
                document.getElementById("top-bar").style.display = "flex";
                if (!isLoggedIn) {
                    document.getElementById("login-page").style.display = "block";
                    document.getElementById("dashboard-page").style.display = "none";
                }
            }, 2000);
        };

        function handleLogin() {
            var loginId = document.getElementById("login-id").value;
            if(!loginId) return;
            
            isLoggedIn = true;
            document.getElementById("login-page").style.display = "none";
            document.getElementById("thank-you-modal").style.display = "flex";
        }

        function proceedToDashboard() {
            document.getElementById("thank-you-modal").style.display = "none";
            document.getElementById("login-page").style.display = "none";
            document.getElementById("dashboard-page").style.display = "block";
        }
    </script>
</body>
</html>
