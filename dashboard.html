<!DOCTYPE html>
<html lang="hi" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Next G Broadband - Dashboard Shell</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-gray-100 dark:bg-gray-950 text-gray-800 dark:text-gray-100 font-sans antialiased transition-colors duration-300">

  <div class="min-h-screen flex flex-col max-w-md mx-auto bg-gray-50 dark:bg-gray-900 shadow-2xl relative overflow-x-hidden pb-8">

    <!-- SIDEBAR DRAWER -->
    <div id="sidebarOverlay" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden"></div>
    
    <aside id="sidebar" class="fixed top-0 left-0 h-full w-80 bg-white dark:bg-gray-900 shadow-2xl z-50 transform -translate-x-full transition-transform duration-300 ease-in-out flex flex-col justify-between border-r dark:border-gray-800">
      <div>
        <div class="p-5 bg-blue-600 text-white flex justify-between items-center">
          <div class="flex items-center space-x-3">
            <div class="relative w-12 h-12">
              <img id="sbUserAvatar" src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=150&q=80" alt="Profile" class="w-12 h-12 rounded-full object-cover border-2 border-white shadow">
            </div>
            <div>
              <h4 class="font-bold text-sm" id="sbUserName">Rahul Sharma</h4>
              <p class="text-xs text-blue-200" id="sbUserPhone">+91 9876543210</p>
            </div>
          </div>
          <button id="btnCloseSidebar"><i data-lucide="x" class="w-5 h-5"></i></button>
        </div>

        <nav class="p-4 space-y-1.5">
          <button id="btnSidebarProfile" class="w-full flex items-center space-x-3 p-3 rounded-xl hover:bg-gray-100 dark:hover:bg-gray-800 text-xs font-semibold text-gray-700 dark:text-gray-200 transition-all">
            <i data-lucide="user-cog" class="w-4 h-4 text-blue-500"></i>
            <span>Profile Settings</span>
          </button>
          <button id="btnSidebarRouter" class="w-full flex items-center space-x-3 p-3 rounded-xl hover:bg-gray-100 dark:hover:bg-gray-800 text-xs font-semibold text-gray-700 dark:text-gray-200 transition-all">
            <i data-lucide="settings" class="w-4 h-4 text-emerald-500"></i>
            <span>Router Settings</span>
          </button>
          <button id="btnSidebarAppLock" class="w-full flex items-center space-x-3 p-3 rounded-xl hover:bg-gray-100 dark:hover:bg-gray-800 text-xs font-semibold text-gray-700 dark:text-gray-200 transition-all">
            <i data-lucide="shield-check" class="w-4 h-4 text-emerald-600"></i>
            <span>App Lock Settings</span>
          </button>
          <button id="btnSidebarLanguage" class="w-full flex items-center space-x-3 p-3 rounded-xl hover:bg-gray-100 dark:hover:bg-gray-800 text-xs font-semibold text-gray-700 dark:text-gray-200 transition-all">
            <i data-lucide="globe" class="w-4 h-4 text-purple-500"></i>
            <span>Language Settings</span>
          </button>
          <div class="flex items-center justify-between p-3 rounded-xl bg-gray-50 dark:bg-gray-800 text-xs font-semibold text-gray-700 dark:text-gray-200">
            <span class="flex items-center gap-2"><i data-lucide="moon" class="w-4 h-4 text-indigo-500"></i> Dark Mode</span>
            <button id="btnSidebarTheme" class="w-10 h-5 bg-gray-300 dark:bg-blue-600 rounded-full relative p-0.5 transition-colors">
              <div class="w-4 h-4 bg-white rounded-full shadow transform dark:translate-x-5 transition-transform"></div>
            </button>
          </div>
          <button id="btnSidebarComplaint" class="w-full flex items-center space-x-3 p-3 rounded-xl hover:bg-gray-100 dark:hover:bg-gray-800 text-xs font-semibold text-gray-700 dark:text-gray-200 transition-all">
            <i data-lucide="life-buoy" class="w-4 h-4 text-amber-500"></i>
            <span>Register Complaint</span>
          </button>
          <button id="btnSidebarLogout" class="w-full flex items-center space-x-3 p-3 rounded-xl bg-red-50 dark:bg-red-950/40 text-red-600 text-xs font-bold border border-red-200 dark:border-red-900 mt-4 transition-all">
            <i data-lucide="log-out" class="w-4 h-4"></i>
            <span>Logout Account</span>
          </button>
        </nav>
      </div>
    </aside>

    <!-- HEADER NAVBAR -->
    <header class="bg-white dark:bg-gray-900 px-4 py-3 shadow-sm flex justify-between items-center sticky top-0 z-40 border-b border-gray-200 dark:border-gray-800">
      <div class="flex items-center space-x-3">
        <button id="btnOpenSidebar" class="p-1.5 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 text-gray-800 dark:text-gray-100 transition-colors">
          <i data-lucide="menu" class="w-6 h-6"></i>
        </button>
        <span class="font-black text-base text-gray-900 dark:text-white flex items-center gap-2">
          <div class="w-7 h-7 rounded-lg bg-blue-600 flex items-center justify-center text-white shadow-md shadow-blue-500/30">
            <i data-lucide="wifi" class="w-4 h-4"></i>
          </div>
          <span>Next G</span>
        </span>
      </div>
      <div class="flex items-center space-x-2">
        <img id="navAvatar" src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=150&q=80" alt="Avatar" class="w-8 h-8 rounded-full object-cover border border-blue-500 cursor-pointer">
      </div>
    </header>

    <!-- TOP NAVIGATION TABS -->
    <div class="p-3 pb-2">
      <div class="bg-gray-200 dark:bg-gray-800 p-1 rounded-xl flex gap-1 overflow-x-auto no-scrollbar">
        <button id="topBtnHome" class="flex-1 py-2 px-2.5 rounded-lg text-xs font-bold whitespace-nowrap transition-all bg-white dark:bg-gray-900 text-blue-600 shadow">🏠 Home</button>
        <button id="topBtnStatus" class="flex-1 py-2 px-2.5 rounded-lg text-xs font-bold whitespace-nowrap transition-all text-gray-500 dark:text-gray-400">📊 Status</button>
        <button id="topBtnRecharge" class="flex-1 py-2 px-2.5 rounded-lg text-xs font-bold whitespace-nowrap transition-all text-gray-500 dark:text-gray-400">💳 Recharge</button>
        <button id="topBtnNewConn" class="flex-1 py-2 px-2.5 rounded-lg text-xs font-bold whitespace-nowrap transition-all text-gray-500 dark:text-gray-400">➕ Connection</button>
      </div>
    </div>

    <!-- VIEWS -->
    <div id="view-home" class="p-4 pt-2 space-y-4 flex-1">
      <div id="activePlanCardContainer"></div>
      <div id="dataAddonContainer" class="space-y-3"></div>
    </div>
    <div id="view-status" class="p-4 pt-2 space-y-4 flex-1 hidden">
      <div id="statusSpeedContainer"></div>
      <div id="statusDevicesContainer"></div>
    </div>
    <div id="view-recharge" class="p-4 pt-2 space-y-4 flex-1 hidden">
      <h3 class="text-sm font-bold text-gray-900 dark:text-white flex items-center gap-1.5"><i data-lucide="zap" class="w-4 h-4 text-amber-500"></i> Select Fiber Recharge Plan</h3>
      <div id="rechargePlansContainer" class="space-y-3"></div>
    </div>
    <div id="view-newconn" class="p-4 pt-2 space-y-4 flex-1 hidden">
      <h3 class="text-sm font-bold text-gray-900 dark:text-white flex items-center gap-1.5"><i data-lucide="plus-circle" class="w-4 h-4 text-emerald-500"></i> New Connection Offers</h3>
      <div id="newConnectionOffersContainer" class="space-y-3"></div>
    </div>

  </div>

  <script type="module" src="./src/app.js"></script>
</body>
</html>
