<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NextG WiFi - Dashboard</title>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
        body { background-color: #0b1329; color: #ffffff; min-height: 100vh; display: flex; flex-direction: column; }

        /* TOPBAR */
        .dashboard-topbar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 20px; background: #0f172a; border-bottom: 1px solid #1e293b;
            position: sticky; top: 0; z-index: 100;
        }
        .topbar-brand { font-weight: 900; font-size: 18px; color: #F58220; }
        .topbar-right { display: flex; align-items: center; gap: 15px; }
        .logout-btn {
            background: #ef4444; color: white; border: none; padding: 6px 12px;
            border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 13px;
        }

        /* MAIN LAYOUT */
        .app-layout { display: flex; flex: 1; position: relative; }

        /* SIDEBAR */
        .sidebar {
            width: 260px; background: #1e293b; border-right: 1px solid #334155;
            padding: 20px 10px; display: flex; flex-direction: column; gap: 8px;
            transition: 0.3s ease;
        }
        .sidebar-item {
            padding: 12px 15px; color: #94a3b8; font-weight: 600; font-size: 14px;
            border-radius: 8px; cursor: pointer; display: flex; align-items: center; gap: 10px;
            transition: 0.2s;
        }
        .sidebar-item:hover, .sidebar-item.active {
            background: #334155; color: #F58220;
        }

        /* CONTAINER CONTENT AREA */
        .app-container {
            flex: 1; padding: 25px; background: #0b1329; overflow-y: auto;
        }

        @media(max-width: 768px) {
            .sidebar { width: 70px; padding: 20px 5px; }
            .sidebar-item span { display: none; }
        }
    </style>
</head>
<body>

    <!-- TOPBAR -->
    <header class="dashboard-topbar">
        <div class="topbar-brand">NextG WiFi Portal</div>
        <div class="topbar-right">
            <span id="userEmailDisplay" style="font-size: 13px; color: #38bdf8;">Loading...</span>
            <button id="logoutBtn" class="logout-btn">Logout</button>
        </div>
    </header>

    <!-- APP LAYOUT (SIDEBAR + CONTAINER) -->
    <div class="app-layout">
        <!-- SIDEBAR -->
        <nav class="sidebar" id="sidebarNav">
            <div class="sidebar-item active" onclick="loadModule('home')">🏠 <span>Home</span></div>
            <div class="sidebar-item" onclick="loadModule('recharge')">💳 <span>Recharge</span></div>
            <div class="sidebar-item" onclick="loadModule('status')">📶 <span>Network Status</span></div>
            <div class="sidebar-item" onclick="loadModule('connection')">➕ <span>New Connection</span></div>
        </nav>

        <!-- MAIN CONTAINER -->
        <main class="app-container" id="mainContainer">
            <!-- Modules will be injected here dynamically -->
            <h2>Welcome to NextG WiFi Dashboard</h2>
            <p style="color: #94a3b8; margin-top: 8px;">बाएँ मेनू से विकल्प चुनें।</p>
        </main>
    </div>

    <!-- SCRIPTS -->
    <script src="./src/app.js"></script>
    <script src="./src/components/sidebar.js"></script>
    <script src="./src/modules/home.js"></script>
</body>
</html>
