<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>NextG WiFi</title>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, Helvetica, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: #0b1329; color: #ffffff; min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }

        /* APP HEADER */
        .app-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 14px 18px; background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 100;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }
        .header-left { display: flex; align-items: center; gap: 12px; }
        .hamburger-btn { background: none; border: none; color: #ffffff; cursor: pointer; display: flex; align-items: center; }
        
        .header-brand { display: flex; align-items: center; gap: 10px; }
        .brand-logo-img { width: 36px; height: 36px; border-radius: 50%; border: 2px solid #F58220; object-fit: cover; background: #fff; }
        .brand-name { font-weight: 800; font-size: 16px; color: #ffffff; letter-spacing: 0.5px; }
        .brand-name span { color: #F58220; }
        
        .header-actions { display: flex; align-items: center; gap: 10px; }
        .icon-btn { background: #1e293b; border: 1px solid #334155; color: #94a3b8; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; }
        .icon-btn:hover { color: #F58220; border-color: #F58220; }

        /* VIEWPORT CONTAINER */
        .app-viewport {
            flex: 1; padding: 20px 16px 90px 16px; max-width: 500px; width: 100%; margin: 0 auto; overflow-y: auto;
        }

        /* BOTTOM APP NAVIGATION */
        .app-bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: rgba(15, 23, 42, 0.98); backdrop-filter: blur(15px);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            display: flex; justify-content: space-around; align-items: center;
            padding: 10px 0 max(10px, env(safe-area-inset-bottom)) 0; z-index: 100;
            max-width: 500px; margin: 0 auto;
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center; gap: 4px;
            color: #64748b; font-size: 11px; font-weight: 600; cursor: pointer;
            transition: 0.2s; background: none; border: none; outline: none; flex: 1;
        }
        .nav-item i { width: 22px; height: 22px; transition: 0.2s; }
        .nav-item.active { color: #F58220; }
        .nav-item.active i { transform: translateY(-2px); filter: drop-shadow(0 0 8px rgba(245, 130, 32, 0.6)); }

        /* CARDS */
        .app-card {
            background: #1e293b; border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 20px; padding: 20px; margin-bottom: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3); position: relative; overflow: hidden;
        }
        .app-card::before {
            content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%; background: #F58220;
        }
        .app-btn {
            background: linear-gradient(135deg, #F58220, #e06f13); color: white; border: none;
            width: 100%; padding: 14px; border-radius: 14px; font-weight: 700; font-size: 14px;
            cursor: pointer; box-shadow: 0 4px 15px rgba(245, 130, 32, 0.4); transition: 0.2s;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
    </style>
</head>
<body>

    <!-- SIDEBAR DYNAMIC CONTAINER -->
    <div id="sidebarContainer"></div>

    <!-- TOP APP HEADER -->
    <header class="app-header">
        <div class="header-left">
            <!-- HAMBURGER MENU BUTTON CONNECTED TO NEW SIDEBAR -->
            <button class="hamburger-btn" onclick="toggleSidebarDrawer(true)">
                <i data-lucide="menu" style="width:22px; height:22px;"></i>
            </button>
            <div class="header-brand">
                <img src="https://i.postimg.cc/wxhBT76M/Next-Wi-Fi-Icon-512x512.png" class="brand-logo-img" alt="Logo">
                <div class="brand-name">NextG <span>WiFi</span></div>
            </div>
        </div>
        <div class="header-actions">
            <button class="icon-btn" onclick="alert('No new notifications')"><i data-lucide="bell" style="width:18px;height:18px;"></i></button>
            <button class="icon-btn" onclick="handleLogout()" title="Logout"><i data-lucide="log-out" style="width:18px;height:18px;"></i></button>
        </div>
    </header>

    <!-- APP VIEWPORT CONTAINER -->
    <main class="app-viewport" id="mainContainer">
        <!-- Dynamic Modules -->
    </main>

    <!-- BOTTOM APP NAVIGATION -->
    <nav class="app-bottom-nav">
        <button class="nav-item active" onclick="switchAppTab('home', this)">
            <i data-lucide="home"></i>
            <span>Home</span>
        </button>
        <button class="nav-item" onclick="switchAppTab('recharge', this)">
            <i data-lucide="credit-card"></i>
            <span>Recharge</span>
        </button>
        <button class="nav-item" onclick="switchAppTab('status', this)">
            <i data-lucide="activity"></i>
            <span>Status</span>
        </button>
        <button class="nav-item" onclick="switchAppTab('connection', this)">
            <i data-lucide="user-plus"></i>
            <span>New Conn</span>
        </button>
    </nav>

    <!-- ALL SCRIPTS IN CORRECT SEQUENCE -->
    <script src="src/components/sidebar.js"></script>
    <script src="src/components/routerControl.js"></script>

    <script src="src/modules/home.js"></script>
    <script src="src/modules/recharge.js"></script>
    <script src="src/modules/status.js"></script>
    <script src="src/modules/connection.js"></script>

    <script src="src/app.js"></script>

    <!-- INIT SCRIPT -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // Render Dynamic Sidebar Component
            const sidebarBox = document.getElementById("sidebarContainer");
            if (sidebarBox && typeof renderSidebarComponent === "function") {
                renderSidebarComponent(sidebarBox);
            }

            // Init Icons
            if (window.lucide) window.lucide.createIcons();

            // Load Default Home Module
            const mainContainer = document.getElementById('mainContainer');
            if (typeof renderHomeModule === 'function' && mainContainer) {
                renderHomeModule(mainContainer);
            }

            // Firebase User Info Sync
            if (typeof firebase !== 'undefined' && firebase.auth().currentUser) {
                const email = firebase.auth().currentUser.email;
                const userEl = document.getElementById('drawerUserEmail');
                if(email && userEl) userEl.innerText = email;
            }
        });

        // Tab Switcher Helper
        function switchAppTab(moduleName, element) {
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            if(element) element.classList.add('active');

            const container = document.getElementById('mainContainer');
            
            if (moduleName === 'home' && typeof renderHomeModule === 'function') {
                renderHomeModule(container);
            } else if (moduleName === 'recharge' && typeof renderRechargeModule === 'function') {
                renderRechargeModule(container);
            } else if (moduleName === 'status' && typeof renderStatusModule === 'function') {
                renderStatusModule(container);
            } else if (moduleName === 'connection' && typeof renderConnectionModule === 'function') {
                renderConnectionModule(container);
            }

            setTimeout(() => { if (window.lucide) window.lucide.createIcons(); }, 50);
        }

        function handleLogout() {
            if (confirm("क्या आप लॉग आउट करना चाहते हैं?")) {
                if (typeof firebase !== 'undefined' && firebase.apps.length) {
                    firebase.auth().signOut().then(() => { window.location.href = "./index.html"; });
                } else {
                    localStorage.removeItem('isLoggedIn');
                    window.location.href = "./index.html";
                }
            }
        }
    </script>
</body>
</html>
